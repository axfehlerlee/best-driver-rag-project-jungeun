name: Coverage
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked
      - name: Report pending Python implementation
        if: hashFiles('src/**/*.py', 'app.py') == ''
        run: echo 'Python environment synced. No application code exists yet; tests and coverage were not run.' >> "$GITHUB_STEP_SUMMARY"
      - run: uv run --locked python -m pytest tests --cov --cov-config=.coveragerc --cov-report=xml:coverage.xml
        if: hashFiles('src/**/*.py', 'app.py') != ''
      - uses: codecov/codecov-action@v7.1.1
        if: hashFiles('src/**/*.py', 'app.py') != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true

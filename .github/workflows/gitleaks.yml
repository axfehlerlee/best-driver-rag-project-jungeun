name: Gitleaks 비밀정보 검사
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 공식 배포 파일 확인 및 설치
        working-directory: ${{ runner.temp }}
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" --output gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 현재 커밋에 이르는 변경 이력 검사
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 \
            --log-opts="--full-history --diff-merges=first-parent HEAD" .

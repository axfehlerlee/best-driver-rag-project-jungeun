name: Lint
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github src scripts tests app.py

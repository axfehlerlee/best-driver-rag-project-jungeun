[project]
name = "seoul-recycling-rag"
version = "0.1.0"
requires-python = "==3.13.14"
dependencies = [
    "datasets>=5.2.0",
    "fastapi",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.17.6",
]

[tool.uv]
package = false
required-version = ">=0.13.9"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
# 대상 버전은 requires-python(==3.13.14)에서 자동으로 정해진다.
src = ["."]

[tool.ruff.lint]
# Ruff 버전이 올라가도 기본 규칙 변화에 흔들리지 않도록 규칙을 명시한다.
# 시작은 문법·이름 오류(F, E9)와 명백한 문장 구조 문제(E4, E7)만 검사한다.
select = ["E4", "E7", "E9", "F"]
